name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-executables:

    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name: SVGMasterPro_Linux
          - os: windows-latest
            asset_name: SVGMasterPro_Windows.exe
          - os: macos-latest
            asset_name: SVGMasterPro_MacOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

    - name: Install dependencies (All)
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 svgelements lxml pyinstaller

    - name: Build with PyInstaller
      shell: bash
      run: |
        # Build using python -m PyInstaller to ensure path correctness
        # --clean to clear cache
        python -m PyInstaller --onefile --windowed --clean --name="SVGMasterPro" app/main.py

    - name: Rename Output
      shell: bash
      run: |
        # Robust renaming strategy
        cd dist
        # Windows output
        if [ -f "SVGMasterPro.exe" ]; then
          mv "SVGMasterPro.exe" "${{ matrix.asset_name }}"
        # Unix output
        elif [ -f "SVGMasterPro" ]; then
          mv "SVGMasterPro" "${{ matrix.asset_name }}"
        else
          echo "Error: Output binary not found!"
          ls -la
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}

  create-release:
    needs: build-executables
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

