name: Build SVGSingleExecutable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build with PyInstaller
      run: |
        # Ensure we are in the root directory where requirements.txt is located
        # pyinstaller needs to point to the main script
        pyinstaller --onefile --windowed --name=SVGMasterPro app/main.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SVGMasterPro-${{ matrix.os }}
        path: dist/SVGMasterPro*
