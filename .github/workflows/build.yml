name: Build Single Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 svgelements lxml pyinstaller

    - name: Build with PyInstaller
      run: |
        # --onefile: Create a single executable
        # --windowed: Do not ensure a console window (for GUI)
        # --name: Name of the output executable
        # --clean: Clean PyInstaller cache
        pyinstaller --onefile --windowed --clean --name="SVGMasterPro" app/main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SVGMasterPro-Linux
        path: dist/SVGMasterPro
        if-no-files-found: error
